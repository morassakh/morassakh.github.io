<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com; media-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://www.google-analytics.com https://*.google-analytics.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تتبع طلبك · مرسّخ</title>
<meta name="description" content="اكتب رقم طلبك وآخر 4 أرقام من جوالك وشوف وين وصل طلبك من مرسّخ.">
<link rel="canonical" href="https://morassakh.com/track.html">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="img/mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
<style>
/* تخطيط: شريط أخضر بالشعار، ثم نموذج البحث، ثم بطاقة الطلب: الحالة، مسار المراحل، التوصيل، الدفع، الشحن */
:root{--forest:#0A2C18;--cream:#FCDCAC;--on-forest:#F6EFE0;--bg:#FAF6EE;--panel:#fff;--ink:#14231A;--muted:#5B665E;--line:#E3DCCB;--soft:#F1EADB;
  --ok:#2F6B45;--now:#B4541F;--warn-bg:#FFEFCF;--warn:#7A4B00;--err:#A3261B;--wa:#1F7A4D;
  --display:"Noto Naskh Arabic","Geeza Pro",serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06140B;--panel:#0D2015;--ink:#EDE6D6;--muted:#A9B1A6;--line:#233A2B;--soft:#122A1B;--ok:#9CD3AE;--now:#F0A274;--warn-bg:#3A2C10;--warn:#FFD98A;--err:#FF9A8F;--wa:#2E9E67;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06140B;--panel:#0D2015;--ink:#EDE6D6;--muted:#A9B1A6;--line:#233A2B;--soft:#122A1B;--ok:#9CD3AE;--now:#F0A274;--warn-bg:#3A2C10;--warn:#FFD98A;--err:#FF9A8F;--wa:#2E9E67;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
[hidden]{display:none!important}
.wrap{max-width:660px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--forest)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:8px}
header img{height:48px;display:block}
header a.back{color:var(--cream);text-decoration:none;font-size:15px;border:1px solid rgba(252,220,172,.5);border-radius:999px;padding:6px 16px}
main .wrap{padding-block:26px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:34px;margin:0;line-height:1.3}
p{margin:0}.muted{color:var(--muted)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;min-width:0}
input{font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);direction:ltr;text-align:center;letter-spacing:.12em;min-width:0;width:100%;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--ok);outline:none}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 24px;background:var(--forest);color:var(--cream);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .15s ease}
button:hover,.btn:hover{transform:translateY(-1px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) .btn{background:var(--cream);color:var(--forest)}}
:root[data-theme="dark"] button,:root[data-theme="dark"] .btn{background:var(--cream);color:var(--forest)}
.btn.wa{background:var(--wa)!important;color:#fff!important}
.btn.line{background:transparent!important;color:var(--ink)!important;border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.msg{background:var(--soft);border-radius:12px;padding:12px 14px}.msg.err{color:var(--err)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:rise .45s ease-out both}
@keyframes rise{from{opacity:.01;transform:translateY(12px)}to{opacity:1;transform:none}}
.top{background:var(--forest);color:var(--on-forest);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.top .ref{font-size:14px;opacity:.85}.top .ref b{font-size:16px;font-variant-numeric:tabular-nums}
.state{font-family:var(--display);font-size:28px;line-height:1.35;color:var(--cream)}
.top .sub{font-size:15px;opacity:.9}
.bar{height:8px;border-radius:99px;background:rgba(252,220,172,.2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--cream);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.in{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px;color:var(--muted)}
ol.steps li:last-child{padding-bottom:0}
ol.steps li .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;z-index:1;transition:background .3s ease,border-color .3s ease}
ol.steps li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:14px;top:30px;bottom:0;width:2px;background:var(--line)}
ol.steps li .dot svg{opacity:0}
ol.steps li b{display:block;font-size:16px}ol.steps li span{font-size:14px}
ol.steps li.done{color:var(--ink)}
ol.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
ol.steps li.done .dot svg{opacity:1}
ol.steps li.done:not(:last-child)::after{background:var(--ok)}
ol.steps li.now{color:var(--ink)}
ol.steps li.now .dot{border-color:var(--now);background:var(--now);color:var(--panel);animation:pulse 1.8s ease-in-out infinite}
ol.steps li.now .dot svg{opacity:1}
ol.steps li.now b{color:var(--now)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 45%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.box{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.box small{color:var(--muted);font-size:13px}
.box b{font-size:17px;overflow-wrap:anywhere}
.box span{font-size:14px;color:var(--muted)}
.box .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.cp{align-self:flex-start;min-height:34px;padding:4px 14px;font-size:14px;margin-top:4px}
.note{border-radius:12px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts .btn{flex:1 1 200px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><a href="./" aria-label="مرسّخ"><img src="img/mark.png" alt="مرسّخ Morassakh"></a><a class="back" href="./">المتجر</a></div></header>
<main><div class="wrap">
  <div><h1>تتبع طلبك</h1><p class="muted">اكتب رقم الطلب اللي في رسالة الواتساب، وآخر 4 أرقام من جوالك.</p></div>
  <form id="f" novalidate>
    <label for="q">رقم الطلب<input id="q" name="o" inputmode="numeric" autocomplete="off" placeholder="482" maxlength="8"></label>
    <label for="p">آخر 4 أرقام من الجوال<input id="p" name="p" inputmode="numeric" autocomplete="off" placeholder="5664" maxlength="12"></label>
    <button type="submit">تتبع</button></form>
  <div class="msg" id="msg" hidden role="status"></div>

  <div class="card" id="card" hidden>
    <div class="top"><span class="ref">طلب رقم <b id="rRef"></b></span><div class="state" id="rState"></div><div class="sub" id="rSub"></div><div class="bar" aria-hidden="true"><i id="rBar"></i></div></div>
    <div class="in">
      <ol class="steps" id="rSteps" aria-label="مراحل الطلب"></ol>
      <div class="note" id="rNote" hidden></div>
      <div class="boxes" id="rBoxes"></div>
      <div class="acts" id="rActs"></div>
    </div>
  </div>

  <p class="muted" style="font-size:14px">التوصيل داخل الرياض خلال 3 أيام عمل، وباقي المدن من 5 إلى 7 أيام عمل. أيام العمل من الأحد إلى الخميس.</p>
  <a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/966549305664">اسألنا على الواتساب</a>
</div></main>
<script>
/* رابط CSV لورقة «تتبع» بعد نشرها من القوقل شيت (ملف > مشاركة > نشر على الويب) */
const TRACK_CSV = "";
const WA_NUMBER = "966549305664";
const STAGES = {
  "جديد": ["استلمنا طلبك", "نراجع الطلب ونأكده معك على الواتساب"],
  "بانتظار الدفع": ["بانتظار التحويل", "حوّل المبلغ وأرسل الإيصال على الواتساب"],
  "يتجهز": ["طلبك يتجهز", "نجهّز الشاي ونغلّفه لك"],
  "جاري التوصيل": ["جاري التوصيل", "طلبك مع شركة الشحن في الطريق لك"],
  "تم التوصيل": ["تم التوصيل", "وصلك الطلب. بالعافية عليك"]
};
const FLOW_BANK = ["جديد", "بانتظار الدفع", "يتجهز", "جاري التوصيل", "تم التوصيل"];
const FLOW_COD = ["جديد", "يتجهز", "جاري التوصيل", "تم التوصيل"];
const OLD = { "مدفوع": "يتجهز", "تم الشحن": "جاري التوصيل", "مكتمل": "تم التوصيل" };
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const digits = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g, "");
const norm = s => digits(s).replace(/^0+(?=\d)/, "");
const last4 = s => digits(s).slice(-4);
function parseCSV(text){ const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){ const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; } else if (c !== "\r") cur += c; }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); } return rows; }
const toDate = s => { const m = /(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmt = d => DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
function workDaysLeft(to){ const t = new Date(); t.setHours(0,0,0,0); let n = 0; const d = new Date(t);
  while (d < to){ d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 5 && w !== 6) n++; } return n; }
function say(text, err){ const m = $("#msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); m.hidden = false; $("#card").hidden = true; }
function box(label, value, extra, copy){ const b = el("div", "box"); b.append(el("small", "", label));
  const v = el("b", copy ? "num" : "", value); b.append(v); if (extra) b.append(el("span", "", extra));
  if (copy){ const c = el("button", "btn line cp", "انسخ"); c.type = "button";
    c.onclick = () => { try { navigator.clipboard.writeText(value).then(() => { c.textContent = "انتسخ"; }, () => {}); } catch (e) {} }; b.append(c); }
  return b; }
function show(o){
  $("#msg").hidden = true;
  const ref = o["رقم الطلب"], pay = o["طريقة الدفع"] || "", region = o["المنطقة"] || "";
  let st = o["الحالة"] || "جديد"; st = OLD[st] || st;
  const cancelled = st === "ملغي";
  const flow = /استلام/.test(pay) ? FLOW_COD : FLOW_BANK;
  let idx = flow.indexOf(st); if (idx < 0 && !cancelled) idx = st === "بانتظار الدفع" ? 0 : 0;
  $("#rRef").textContent = ref;
  $("#rState").textContent = cancelled ? "الطلب ملغي" : STAGES[flow[idx]][0];
  $("#rSub").textContent = cancelled ? "إذا عندك سؤال عن الإلغاء راسلنا على الواتساب" : STAGES[flow[idx]][1];
  const bar = $("#rBar"); bar.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = cancelled ? "0" : Math.round(100 * (idx + 1) / flow.length) + "%"; }));
  const ol = $("#rSteps"); ol.replaceChildren(); ol.hidden = cancelled;
  flow.forEach((s, i) => { const li = el("li", i < idx || (i === idx && s === "تم التوصيل") ? "done" : i === idx ? "now" : "");
    const dot = el("span", "dot"); dot.innerHTML = li.className === "now" ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg>' : CHECK; li.append(dot);
    const t = el("div"); t.append(el("b", "", s === "تم التوصيل" && /استلام/.test(pay) ? "تم التوصيل والدفع" : STAGES[s][0]), el("span", "", STAGES[s][1])); li.append(t);
    li.style.transitionDelay = (i * 120) + "ms"; ol.append(li); });
  const note = $("#rNote"); note.hidden = true;
  if (!cancelled && st === "بانتظار الدفع"){ note.textContent = "طلبك محجوز لك. حوّل المبلغ وأرسل صورة الإيصال على الواتساب، ونبدأ التجهيز أول ما يوصلنا."; note.hidden = false; }
  if (!cancelled && /استلام/.test(pay) && st !== "تم التوصيل"){ note.textContent = "الدفع عند الاستلام: جهّز المبلغ للمندوب، وتأكد إن جوالك متاح وقت التوصيل."; note.hidden = false; }
  const bx = $("#rBoxes"); bx.replaceChildren();
  const dates = (o["موعد الوصول المتوقع"] || "").match(/\d{4}-\d{2}-\d{2}/g) || [];
  if (!cancelled && st !== "تم التوصيل" && dates.length){
    const a = toDate(dates[0]), b = toDate(dates[dates.length - 1]);
    const left = workDaysLeft(b);
    const when = dates.length > 1 ? "بين " + fmt(a) + " و" + fmt(b) : fmt(a);
    bx.append(box("الوصول المتوقع", when, left > 0 ? "باقي تقريباً " + left + " " + (left === 1 ? "يوم عمل" : left === 2 ? "يومين عمل" : left <= 10 ? "أيام عمل" : "يوم عمل") : "اليوم أو قريب جداً")); }
  if (region) bx.append(box("منطقة التوصيل", region, region === "الرياض" ? "خلال 3 أيام عمل" : "من 5 إلى 7 أيام عمل"));
  if (pay) bx.append(box("طريقة الدفع", pay));
  if (o["التاريخ"]){ const d = toDate(o["التاريخ"]); bx.append(box("تاريخ الطلب", d ? fmt(d) : o["التاريخ"])); }
  if (o["شركة الشحن"]) bx.append(box("شركة الشحن", o["شركة الشحن"]));
  if (o["رقم التتبع"]) bx.append(box("رقم الشحنة", o["رقم التتبع"], "تقدر تتابعها من موقع شركة الشحن", true));
  const acts = $("#rActs"); acts.replaceChildren();
  const wa = el("a", "btn wa", st === "بانتظار الدفع" ? "أرسل إيصال التحويل" : "اسألنا عن طلبك");
  wa.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent((st === "بانتظار الدفع" ? "السلام عليكم، هذا إيصال التحويل لطلبي رقم " : "السلام عليكم، أستفسر عن طلبي رقم ") + ref);
  wa.target = "_blank"; wa.rel = "noopener"; acts.append(wa);
  if (st === "تم التوصيل"){ const r = el("a", "btn line", "اطلب مرة ثانية"); r.href = "./#product"; acts.append(r); }
  $("#wa").hidden = true;
  $("#card").hidden = false; $("#card").style.animation = "none"; void $("#card").offsetWidth; $("#card").style.animation = "";
}
async function track(ref, ph){ ref = norm(ref); ph = last4(ph);
  if (!ref) return say("اكتب رقم الطلب أول.", true);
  if (ph.length < 4) return say("اكتب آخر 4 أرقام من جوالك اللي طلبت فيه.", true);
  if (!TRACK_CSV) return say("خدمة التتبع تتفعّل قريباً. راسلنا على الواتساب برقم طلبك ونعطيك حالته.");
  say("نبحث عن طلبك…");
  try { const res = await fetch(TRACK_CSV + (TRACK_CSV.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }); if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text()); const head = rows[0].map(h => h.trim());
    const hit = rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()]))).find(o => norm(o["رقم الطلب"]) === ref && last4(o["آخر 4 من الجوال"]) === ph);
    hit ? show(hit) : say("ما لقينا طلب بهذا الرقم والجوال. تأكد منهم، وإذا طلبك جديد ممكن ما انسجّل للحين.", true);
  } catch (e) { say("ما قدرنا نجيب حالة الطلب الحين. جرّب بعد شوي أو راسلنا على الواتساب.", true); } }
$("#f").addEventListener("submit", ev => { ev.preventDefault(); track($("#q").value, $("#p").value); });
const pre = new URLSearchParams(location.search).get("o"); if (pre){ $("#q").value = norm(pre); $("#p").focus(); }
</script>
</body>
</html>
